  <path d="M337 414H463L337 536H463" fill="none" stroke="url(#blue)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="337" cy="414" r="20" fill="#65b9ff"/>
  <circle cx="463" cy="536" r="20" fill="#294edb"/>

server {
    listen 80;
    server_name _;
    # Preserve the browser's host port when Docker maps it to container port 80.
    absolute_redirect off;
    root /usr/share/nginx/html;
    client_max_body_size 20m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = / { return 302 /miniagent/; }
    location = /miniagent { return 308 /miniagent/; }

    location /miniagent/api/ {
        proxy_pass http://backend:8066;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /miniagent/assets/ {
        try_files $uri =404;
        expires 7d;
    }

    location /miniagent/ {
        try_files $uri $uri/ /miniagent/index.html;
    }
}
